version: '3.8'

services:
  # Main application service
  lung-cancer-app:
    build:
      context: .
      target: production
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - DEBUG=false
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
      - ./static/uploads:/app/static/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - lung-cancer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL database
  postgres:
    image: postgres:13-alpine
    environment:
      - POSTGRES_DB=lung_cancer_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - lung-cancer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lung-cancer-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy (optional, for production deployment)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./static:/app/static:ro
    depends_on:
      - lung-cancer-app
    networks:
      - lung-cancer-network
    restart: unless-stopped
    profiles:
      - production

  # Model training service (optional, for retraining models)
  model-trainer:
    build:
      context: .
      target: development
    environment:
      - TRAINING_DATA_PATH=/app/data/training
      - MODEL_OUTPUT_PATH=/app/models
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - lung-cancer-network
    profiles:
      - training
    command: ["python", "scripts/train_models.py"]

volumes:
  postgres_data:
  redis_data:

networks:
  lung-cancer-network:
    driver: bridge</content>
